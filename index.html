<style>[hidden]{display:none!important}img{max-width:100%}

/* weather live + reminders + details */
.wxlive{display:flex;flex-direction:column;gap:12px}
.wx-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.wx-place{font-weight:700;margin-inline-end:auto}
.wx-now{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.wx-now>div{display:flex;flex-direction:column;font-size:.9rem;min-width:0}.wx-now b{font-size:1.1rem}
.wx-ico{font-size:2.4rem;line-height:1}.wx-upd{margin-inline-start:auto;font-size:.75rem;opacity:.65}
.wx-days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wx-day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:14px;border:1px solid rgba(31,90,60,.25);background:rgba(255,255,255,.6);color:var(--forest-900);cursor:pointer;font:inherit;transition:.2s}
.wx-day:hover{background:#fff;transform:translateY(-2px)}.wx-day small{font-size:.72rem;font-weight:700;opacity:.75}.wx-day i{font-style:normal;font-size:1.4rem}.wx-day b{font-size:.95rem}.wx-day span{font-size:.78rem;opacity:.6}
.wx-day[aria-pressed="true"]{background:linear-gradient(180deg,var(--forest-500),var(--forest-700));color:var(--cream);border-color:transparent;box-shadow:0 6px 14px rgba(15,47,32,.25)}
.wx-tip{font-size:.9rem;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.55);border:1px dashed rgba(31,90,60,.3)}
.t-actions{display:flex;gap:6px;flex:none}
.rem{margin-top:6px;padding-top:14px;border-top:1px dashed rgba(31,90,60,.3);display:flex;flex-direction:column;gap:10px}
.rem-head,.rem-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.rem-head b{margin-inline-end:auto}
.rem-row label{font-size:.85rem;font-weight:600;margin-inline-end:auto}
.rem input[type=time]{font:inherit;padding:.4em .7em;border-radius:12px;border:1px solid rgba(31,90,60,.35);background:rgba(255,255,255,.8)}
.switch{width:46px;height:26px;border-radius:999px;border:1px solid var(--line);background:rgba(31,90,60,.22);position:relative;cursor:pointer;transition:.2s;padding:0}
.switch i{position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.switch[aria-checked="true"]{background:var(--forest-600)}.switch[aria-checked="true"] i{inset-inline-start:22px}
.dt-top{display:flex;gap:16px;align-items:center}.dt-top h2{margin:0}.al2{font-size:.85rem;color:var(--forest-600);margin:2px 0 6px}
.dt-row{display:flex;flex-direction:column;gap:6px}.dt-chips{display:flex;flex-wrap:wrap;gap:6px}
@media(max-width:560px){.wx-day{padding:6px 0}.t-actions{flex-direction:column}}
</style>
<title>Plant Parent</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: cream-white ground (60%), glossy leaf green for panels and actions (30%), deep forest for type and details (10%), one blossom-pink accent. */
:root{
  --forest-900:#0f2f20; --forest-800:#17432d; --forest-700:#1f5a3c; --forest-600:#2f7a50; --forest-500:#3f9a63;
  --leaf-100:#eaf7df; --leaf-200:#d2f0c0; --leaf-300:#aee39e; --leaf-400:#86d296; --leaf-500:#4fb06f;
  --cream:#fdfcf6; --cream-2:#eef2e0; --bloom:#ff9aa5; --bloom-100:#ffe3e1; --rose:#d9485f;
  --bg:#f4f8ec; --ink:var(--forest-900); --ink-dim:rgba(15,47,32,.72); --ink-faint:rgba(15,47,32,.5);
  --line:rgba(47,122,80,.24);
  --f-display:'Fraunces','Amiri',Georgia,serif;
  --f-body:'Manrope','IBM Plex Sans Arabic',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
[lang="ar"]{ --f-display:'Amiri','Fraunces',serif; --f-body:'IBM Plex Sans Arabic','Manrope',system-ui,sans-serif; }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:clip;
  background:
    radial-gradient(900px 600px at 90% -10%,rgba(174,227,158,.75),transparent 60%),
    radial-gradient(700px 500px at -10% 45%,rgba(255,227,225,.85),transparent 60%),
    radial-gradient(800px 500px at 60% 105%,rgba(134,210,150,.4),transparent 60%),
    linear-gradient(180deg,#f8fcf1,#eef6e2)}
.wrap{max-width:1160px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--forest-600);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* gloss primitives */
.gloss{position:relative;isolation:isolate}
.gloss::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(158deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,.14) 30%,rgba(255,255,255,0) 46%)}
.gloss::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .35s;
  background:radial-gradient(260px 200px at var(--mx,30%) var(--my,0%),rgba(255,255,255,.7),transparent 70%)}
.leaf-card.gloss::before{background:linear-gradient(158deg,rgba(255,255,255,.28),rgba(255,255,255,.05) 30%,rgba(255,255,255,0) 46%)}
.gloss:hover::after{opacity:1}
.card{border-radius:26px;border:1px solid var(--line);
  background:linear-gradient(155deg,#fff,#f1f9e8 62%,var(--leaf-200));
  box-shadow:inset 0 2px 0 #fff,inset 0 -16px 30px rgba(79,176,111,.16),0 18px 40px rgba(31,90,60,.16)}
.leaf-card{border-radius:30px;color:var(--forest-900);border:1px solid rgba(255,255,255,.7);
  background:linear-gradient(155deg,var(--leaf-100),var(--leaf-300) 50%,var(--leaf-500));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset 0 -22px 40px rgba(31,90,60,.3),0 24px 50px rgba(31,90,60,.28)}
.paper-card{border-radius:30px;color:var(--forest-900);border:1px solid var(--line);
  background:linear-gradient(155deg,#fff,var(--cream) 60%,var(--cream-2));
  box-shadow:inset 0 2px 0 #fff,inset 0 -22px 40px rgba(79,176,111,.1),0 24px 50px rgba(31,90,60,.16)}

/* buttons */
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;border-radius:999px;padding:.78em 1.4em;font-weight:700;font-size:.95rem;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:.55em;transition:transform .25s var(--ease),filter .25s,box-shadow .25s;white-space:nowrap}
.btn svg{width:1.15em;height:1.15em;flex:none}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn::after{content:"";position:absolute;top:-20%;bottom:-20%;width:34%;inset-inline-start:-50%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);transition:inset-inline-start .6s var(--ease)}
.btn:hover::after{inset-inline-start:130%}
.btn-leaf{color:var(--forest-900);
  background:linear-gradient(180deg,#e4f8d4 0%,var(--leaf-400) 49%,var(--leaf-500) 51%,var(--leaf-400) 100%);
  box-shadow:inset 0 1px 0 #fff,inset 0 -2px 6px rgba(31,90,60,.35),0 10px 24px rgba(79,176,111,.4)}
.btn-ghost{background:rgba(255,255,255,.55);border:1px solid rgba(31,90,60,.35);color:var(--forest-800);box-shadow:inset 0 1px 0 #fff}
.btn-ghost:hover{background:#fff}
.btn-cream{color:var(--forest-900);background:linear-gradient(180deg,#fff 0%,var(--cream) 49%,var(--cream-2) 51%,var(--cream) 100%);
  box-shadow:inset 0 1px 0 #fff,0 8px 20px rgba(31,90,60,.2);border:1px solid var(--line)}
.btn-dark{color:var(--cream);background:linear-gradient(180deg,var(--forest-500) 0%,var(--forest-600) 49%,var(--forest-800) 51%,var(--forest-700) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 20px rgba(15,47,32,.3)}
.btn-sm{padding:.55em 1.05em;font-size:.86rem}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.75);cursor:pointer;display:grid;place-items:center;color:var(--ink-dim);transition:.2s}
.icon-btn:hover{background:var(--leaf-200);color:var(--forest-900)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.armed{background:var(--rose);color:#fff;border-color:transparent;width:auto;padding-inline:.8em;border-radius:999px;font-size:.78rem;font-weight:700}

/* header */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;margin-top:10px;
  display:flex;align-items:center;gap:14px;padding:9px 12px 9px 18px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(234,247,223,.9));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff,0 12px 30px rgba(31,90,60,.18)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:1.25rem;text-decoration:none;color:var(--forest-900);margin-inline-end:auto;white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--forest-800);
  background:radial-gradient(circle at 30% 25%,#fff,var(--leaf-300) 55%,var(--leaf-500));box-shadow:inset 0 -3px 6px rgba(31,90,60,.4),0 4px 10px rgba(31,90,60,.25)}
.logo svg{width:18px;height:18px}
.nav{display:flex;gap:4px}
.nav a{color:var(--ink-dim);text-decoration:none;font-weight:600;font-size:.92rem;padding:.5em 1em;border-radius:999px;transition:.2s}
.nav a:hover{background:rgba(79,176,111,.18);color:var(--forest-900)}
.lang{border:0;cursor:pointer;border-radius:999px;padding:.5em 1.1em;font-weight:700;font-size:.9rem}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center;padding-block:44px 28px}
.eyebrow{display:inline-flex;align-items:center;gap:.6em;font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--forest-600)}
[lang="ar"] .eyebrow{letter-spacing:0;text-transform:none;font-size:.95rem}
.eyebrow::before{content:"";width:26px;height:2px;background:linear-gradient(90deg,var(--forest-500),transparent);border-radius:2px}
.hero h1{font-size:clamp(2.6rem,6.4vw,5rem);margin-block:16px 18px;letter-spacing:-.02em;color:var(--forest-900)}
[lang="ar"] .hero h1{letter-spacing:0;line-height:1.25}
.hero h1 em{font-style:italic;font-weight:400;color:var(--forest-500)}
[lang="ar"] .hero h1 em{font-style:normal}
.hero .sub{max-width:52ch;color:var(--ink-dim);font-size:1.08rem}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.stat{padding:12px 18px;min-width:110px}
.stat b{display:block;font-family:var(--f-display);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--ink-dim)}
.art{position:relative;width:100%;max-width:460px;aspect-ratio:1/1.04;margin-inline:auto;--px:0;--py:0}
.blob{position:absolute;animation:morph 14s ease-in-out infinite;transition:transform .5s var(--ease)}
@keyframes morph{0%,100%{border-radius:58% 42% 55% 45%/52% 55% 45% 48%}33%{border-radius:44% 56% 42% 58%/58% 44% 56% 42%}66%{border-radius:52% 48% 60% 40%/46% 58% 42% 54%}}
.b-forest{width:82%;height:60%;bottom:3%;left:9%;
  background:radial-gradient(55% 38% at 28% 20%,rgba(255,255,255,.75),transparent 62%),linear-gradient(160deg,var(--leaf-400),var(--leaf-500) 45%,var(--forest-600));
  box-shadow:inset 0 -26px 44px rgba(15,47,32,.4),inset 0 12px 28px rgba(255,255,255,.3),0 36px 60px rgba(31,90,60,.35);
  transform:translate(calc(var(--px)*-14px),calc(var(--py)*-10px))}
.b-mint{width:48%;height:36%;top:10%;inset-inline-end:-2%;animation-delay:-4s;
  background:radial-gradient(55% 40% at 30% 22%,rgba(255,255,255,.95),transparent 62%),linear-gradient(160deg,var(--leaf-100),var(--leaf-300) 55%,var(--leaf-400));
  box-shadow:inset 0 -16px 28px rgba(31,90,60,.3),0 24px 40px rgba(31,90,60,.28);
  transform:translate(calc(var(--px)*22px),calc(var(--py)*16px))}
.b-bloom{width:32%;height:25%;top:34%;inset-inline-start:0;animation-delay:-8s;
  background:radial-gradient(55% 40% at 30% 22%,#fff,transparent 62%),linear-gradient(160deg,var(--bloom-100),var(--bloom) 70%,#f27a88);
  box-shadow:inset 0 -12px 22px rgba(143,43,61,.3),0 20px 34px rgba(143,43,61,.25);
  transform:translate(calc(var(--px)*30px),calc(var(--py)*-18px))}
.plant{position:absolute;inset:2% 12% 8%;width:76%;height:90%;transform-origin:50% 95%;animation:sway 7s ease-in-out infinite;
  transform:translate(calc(var(--px)*8px),calc(var(--py)*6px));filter:drop-shadow(0 14px 18px rgba(15,47,32,.3))}
@keyframes sway{0%,100%{rotate:-1.4deg}50%{rotate:1.6deg}}

/* sections */
section{padding-block:26px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sec-head h2{font-size:clamp(1.8rem,3.6vw,2.6rem)}
.sec-head p{color:var(--ink-dim);margin-top:6px;max-width:56ch}

/* weather + today */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.weather{padding:26px;display:flex;flex-direction:column;gap:18px;min-width:0}
.weather h2{font-size:1.5rem}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
[lang="ar"] .field>label,[lang="ar"] .lbl{letter-spacing:0;text-transform:none;font-size:.88rem}
select,input[type=text]{width:100%;border-radius:16px;padding:.7em 1em;border:1px solid rgba(31,90,60,.28);background:rgba(255,255,255,.85);color:var(--forest-900);font-weight:600;
  box-shadow:inset 0 2px 4px rgba(31,90,60,.1);appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--forest-700) 50%),linear-gradient(135deg,var(--forest-700) 50%,transparent 50%);
  background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-inline-end:2.4em}
[dir="rtl"] select{background-position:20px 55%,14px 55%}
.climate{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.temp{font-family:var(--f-display);font-size:4rem;line-height:1;font-variant-numeric:tabular-nums}
.temp small{font-size:1.4rem;opacity:.7}
.kv{display:flex;flex-direction:column;font-size:.9rem}
.kv b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid rgba(31,90,60,.3);background:rgba(255,255,255,.6);color:var(--forest-900);border-radius:999px;padding:.45em .95em;font-weight:600;font-size:.88rem;cursor:pointer;transition:.2s}
.seg button:hover{background:#fff}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--forest-500),var(--forest-700));color:var(--cream);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px rgba(15,47,32,.3)}
.pace{display:flex;gap:10px;flex-wrap:wrap}
.pace div{flex:1 1 140px;background:rgba(255,255,255,.65);border-radius:18px;padding:10px 14px;box-shadow:inset 0 1px 0 #fff}
.pace b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.pace span{font-size:.8rem}
.note{font-size:.84rem;opacity:.8}

.today{align-self:start;padding:26px;display:flex;flex-direction:column;gap:14px;min-width:0}
.today-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.today-head h2{font-size:1.5rem}
.badge{font-variant-numeric:tabular-nums;font-weight:700;border-radius:999px;padding:.15em .8em;background:var(--forest-800);color:var(--cream);font-size:.9rem}
.tasks{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.task{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:rgba(79,176,111,.1);border:1px solid var(--line);animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.task .dot{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--forest-800)}
.task .dot svg{width:20px;height:20px}
.dot.w{background:radial-gradient(circle at 30% 25%,#fff,var(--leaf-300) 55%,var(--leaf-500));box-shadow:inset 0 -3px 6px rgba(31,90,60,.3)}
.dot.f{background:radial-gradient(circle at 30% 25%,#fff,var(--bloom-100) 50%,var(--bloom));color:#8f2b3d;box-shadow:inset 0 -3px 6px rgba(143,43,61,.25)}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;overflow-wrap:anywhere}
.task .tx span{font-size:.82rem;color:var(--ink-dim)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 12px;color:var(--ink-dim)}
.empty .orb{width:64px;height:64px}
.rain-note{font-size:.84rem;color:var(--forest-700);background:rgba(63,154,99,.15);border-radius:14px;padding:8px 12px}

/* garden */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.plant-card{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s;transform-style:preserve-3d;will-change:transform}
.pc-top{display:flex;gap:14px;align-items:center}
.orb{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;overflow:hidden}
.orb svg{width:60%;height:60%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;position:relative}
.orb::before{content:"";position:absolute;inset:6% 18% 54% 14%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
.o-leaf{color:var(--forest-800);background:radial-gradient(circle at 30% 25%,#fff,var(--leaf-300) 55%,var(--leaf-500));box-shadow:inset 0 -5px 10px rgba(31,90,60,.4),0 6px 14px rgba(31,90,60,.28)}
.o-cream{color:var(--forest-700);background:radial-gradient(circle at 30% 25%,#fff,var(--cream-2) 55%,#cfd8bd);box-shadow:inset 0 -5px 10px rgba(31,90,60,.2),0 6px 14px rgba(31,90,60,.22)}
.o-forest{color:var(--cream);background:radial-gradient(circle at 30% 25%,var(--leaf-500),var(--forest-600) 55%,var(--forest-900));box-shadow:inset 0 -5px 10px rgba(0,0,0,.35),0 6px 14px rgba(15,47,32,.3)}
.o-bloom{color:#8f2b3d;background:radial-gradient(circle at 30% 25%,#fff,var(--bloom-100) 45%,var(--bloom));box-shadow:inset 0 -5px 10px rgba(143,43,61,.3),0 6px 14px rgba(143,43,61,.22)}
.pc-name{min-width:0;flex:1}
.pc-name h3{font-size:1.35rem;overflow-wrap:anywhere}
.pc-name span{font-size:.85rem;color:var(--ink-dim)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:.72rem;font-weight:700;padding:.15em .7em;border-radius:999px;background:var(--leaf-200);color:var(--forest-700);border:1px solid var(--line)}

.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:rgba(79,176,111,.12)}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:rgba(31,90,60,.14)}
.ring .fg{stroke:var(--leaf-500);stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease),stroke .3s;filter:drop-shadow(0 0 3px rgba(79,176,111,.5))}
.ring.now .fg{stroke:var(--forest-600)}
.ring.late .fg{stroke:var(--rose)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.9rem;font-variant-numeric:tabular-nums}
.ring b svg{width:20px;height:20px;transform:none}
.row .tx{flex:1;min-width:0;line-height:1.35}
.row .tx span{display:block;font-size:.78rem;color:var(--ink-dim)}
.row .tx b{font-size:.95rem}
.pc-actions{display:flex;gap:8px;align-items:center}
.pc-actions .btn{flex:1}
.drop{position:absolute;top:-10px;width:8px;height:12px;border-radius:50% 50% 55% 55%/65% 65% 40% 40%;background:linear-gradient(180deg,var(--leaf-300),var(--leaf-500));z-index:5;pointer-events:none;animation:fall .9s ease-in forwards}

.pulse{animation:pulse .7s var(--ease)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,176,111,.6)}100%{box-shadow:0 0 0 26px rgba(79,176,111,0)}}
.sync{display:inline-flex;align-items:center;gap:.55em;margin-top:10px;font-size:.8rem;font-weight:600;padding:.25em .9em;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid var(--line);color:var(--forest-700)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-faint)}
.sync.on::before{background:var(--leaf-500);box-shadow:0 0 0 3px rgba(79,176,111,.28)}
.sync.err::before{background:var(--rose)}
.garden-empty{grid-column:1/-1;padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}

/* diagnose */
.dx{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.dx-form{padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.drop-zone{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:190px;padding:18px;
  border-radius:24px;border:2px dashed rgba(47,122,80,.5);background:rgba(174,227,158,.22);cursor:pointer;transition:.25s;overflow:hidden}
.drop-zone:hover,.drop-zone.over{background:rgba(174,227,158,.45);border-color:var(--forest-600);transform:scale(1.01)}
.drop-zone .orb{width:56px;height:56px}
.drop-zone img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover}
.drop-zone .clear{position:absolute;top:10px;inset-inline-end:10px;z-index:3}
.drop-zone .scan{position:absolute;inset-inline:0;height:70px;z-index:2;background:linear-gradient(180deg,transparent,rgba(79,176,111,.6),transparent);animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%{top:-70px}100%{top:100%}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(31,90,60,.3);background:rgba(255,255,255,.75);color:var(--forest-900);border-radius:999px;padding:.45em 1em;font-size:.88rem;font-weight:600;cursor:pointer;transition:.2s}
.chip:hover{background:#fff}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#e4f8d4,var(--leaf-400) 50%,var(--leaf-500) 52%,var(--leaf-400));color:var(--forest-900);border-color:transparent;box-shadow:inset 0 1px 0 #fff,0 6px 14px rgba(79,176,111,.35)}
.dx-out{padding:26px;min-height:340px;display:flex;flex-direction:column;gap:16px;min-width:0}
.dx-out h3{font-size:1.7rem}
.dx-out .placeholder{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:.8;max-width:30ch}
.dx-out .orb{width:60px;height:60px}
.sev{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:.2em .9em}
.sev.low{background:var(--leaf-300);color:var(--forest-900)}
.sev.medium{background:var(--forest-600);color:var(--cream)}
.sev.high{background:var(--rose);color:#fff}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.conf{display:flex;align-items:center;gap:8px;font-size:.82rem}
.conf i{display:block;width:90px;height:7px;border-radius:7px;background:rgba(31,90,60,.15);overflow:hidden}
.conf i::after{content:"";display:block;height:100%;width:var(--c,0%);background:linear-gradient(90deg,var(--leaf-500),var(--forest-600));border-radius:7px}
.dx-out h4{margin:0 0 6px;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;opacity:.65}
[lang="ar"] .dx-out h4{letter-spacing:0;text-transform:none;font-size:.9rem}
.dx-out ul,.dx-out ol{margin:0;padding-inline-start:1.3em;display:flex;flex-direction:column;gap:6px}
.dx-out .blk+.blk{border-top:1px solid rgba(31,90,60,.15);padding-top:14px}
.dx-out .foot{font-size:.8rem;opacity:.7;margin-top:auto}
.shimmer{height:14px;border-radius:8px;background:linear-gradient(90deg,rgba(79,176,111,.12),rgba(79,176,111,.32),rgba(79,176,111,.12));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* modal + toast */
.veil{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(15,47,32,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.modal{width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:26px;display:flex;flex-direction:column;gap:18px;animation:rise .35s var(--ease) both}
.modal h2{font-size:1.8rem}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;max-height:min(42vh,320px);overflow:auto;padding:4px;margin:-4px;overscroll-behavior:contain}
.sp{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 8px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.75);color:var(--forest-900);cursor:pointer;transition:.2s}
.sp:hover{background:#fff}
.sp .orb{width:42px;height:42px}
.sp b{font-size:.88rem;line-height:1.25}
.sp span{font-size:.72rem;color:var(--ink-dim)}
.sp[aria-pressed="true"]{background:linear-gradient(180deg,#e4f8d4,var(--leaf-400) 50%,var(--leaf-500) 52%,var(--leaf-400));border-color:transparent;box-shadow:0 8px 20px rgba(79,176,111,.4)}
.sp[aria-pressed="true"] span{color:var(--forest-800)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;inset-inline:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);z-index:60;
  padding:.7em 1.4em;border-radius:999px;font-weight:700;color:var(--cream);background:linear-gradient(180deg,var(--forest-600),var(--forest-900));box-shadow:0 14px 34px rgba(15,47,32,.4);
  transform:translateY(30px);opacity:0;pointer-events:none;transition:.35s var(--ease)}
.toast.on{transform:none;opacity:1}
footer{padding-block:30px 10px;color:var(--ink-faint);font-size:.85rem;text-align:center}

@media (max-width:860px){
  .hero,.duo,.dx{grid-template-columns:1fr}

  .hero{padding-top:24px}
  .nav{display:none}
}
@media (max-width:480px){

}

}

.p3d{display:grid;place-items:center;width:58px;height:58px;flex:none;perspective:300px}

.sp .p3d{width:64px;height:64px}
.sp:hover .p3d svg,.plant-card:hover .p3d svg{animation:p3dSpin 1.6s var(--ease) 1}

@keyframes p3dSpin{to{transform:rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.p3d svg{animation:none!important}}
.sp .al,.pc-name .al{display:block;font-style:normal;font-size:.7rem;line-height:1.3;color:var(--forest-600);opacity:.95}
.sp-grid{max-height:min(46vh,380px)}
.seg button{display:inline-flex;align-items:center;gap:.4em}
.seg .ci{display:inline-grid;width:1.25em;height:1.25em}
.seg .ci svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.p3d{position:relative}
.p3d img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:18px;border:2px solid #fff;box-shadow:0 6px 14px rgba(15,47,32,.3);animation:rise .4s var(--ease) both}
.p3d.has-photo svg{opacity:0}
.sp .p3d{width:76px;height:76px}.p3d.big{width:92px;height:92px}

.sp{padding:8px 8px 12px}
.sp .p3d{width:100%;height:108px;border-radius:16px}
.sp .p3d svg{width:auto;height:92%}
.sp .p3d img{border-radius:16px;border-width:0;box-shadow:0 4px 10px rgba(15,47,32,.22)}
.p3d.big{width:96px;height:96px}
.p3d.has-photo{filter:none}
footer .credit{display:block;margin-top:4px;font-size:.78rem;opacity:.85}

  const titles=batch.map(([id,e])=>e.tries===0?(WT[id]||altTitle(id)):altTitle(id));

  steps:{en:['Isolate the plant.','Wipe leaves with a damp cloth.','Spray weekly with neem oil, or 1 tsp baking soda in 1 litre of water.','Give plants more space and airflow.'],ar:['اعزل النبات.','امسح الأوراق بقطعة قماش مبللة.','رشّ أسبوعيًا بزيت النيم أو بملعقة صغيرة صودا الخبز في لتر ماء.','أعطِ النباتات مساحة وتهوية أكثر.']},
  prev:{en:'Avoid wetting leaves late in the day.',ar:'تجنّب بلّ الأوراق في آخر النهار.'}},
 droop:{sev:1,en:'Drooping',ar:'ذبول وتدلّي',
  cause:{en:['Thirst: the plant has used up its water.','Root rot from overwatering also causes drooping.'],ar:['عطش: استهلك النبات ماءه.','تعفّن الجذور من الريّ الزائد يسبب الذبول أيضًا.']},
  steps:{en:['Check the soil first, since the fix depends on it.','If dry, water slowly until it drains; it should perk up within hours.','If wet and smelly, unpot and inspect the roots.','Move it out of harsh afternoon sun.'],ar:['افحص التربة أولًا فالعلاج يعتمد عليها.','إن كانت جافة فاسقِ ببطء حتى يخرج الماء من الأسفل؛ ينتعش النبات خلال ساعات.','إن كانت رطبة ورائحتها كريهة فأخرجه وافحص الجذور.','انقله بعيدًا عن شمس العصر القوية.']},
  prev:{en:'Lift the pot: a light pot means it is time to water.',ar:'ارفع الأصيص: الأصيص الخفيف يعني أن وقت الري حان.'}},
 curl:{sev:0,en:'Curling leaves',ar:'التفاف الأوراق',
  cause:{en:['Heat or dry air makes leaves curl to save water.','Thrips or other tiny pests, if leaves are also speckled.'],ar:['الحر أو جفاف الهواء يجعل الأوراق تلتف لحفظ الماء.','حشرات الثرِبس الصغيرة إن ظهرت نقاط على الأوراق.']},
  steps:{en:['Move away from hot windows and vents.','Water deeply, then let the top soil dry.','Inspect leaf undersides for tiny insects.','Wipe leaves with soapy water if you find any.'],ar:['ابعده عن النوافذ الحارة وفتحات التكييف.','اسقِ بعمق ثم دع الطبقة العليا تجفّ.','افحص الجهة السفلية للأوراق بحثًا عن حشرات صغيرة.','امسح الأوراق بماء وصابون إن وجدت حشرات.']},
  prev:{en:'Mist or group plants during heatwaves.',ar:'رشّ الماء أو اجمع النباتات أثناء موجات الحر.'}},
 pests:{sev:1,en:'Insects or sticky film',ar:'حشرات أو مادة لزجة',
  cause:{en:['Aphids, spider mites or mealybugs: sticky residue, webbing or white fluff.','Weak plants attract pests more easily.'],ar:['منّ أو عنكبوت أحمر أو بق دقيقي: مادة لزجة أو خيوط أو زغب أبيض.','النباتات الضعيفة تجذب الآفات بسهولة.']},
  steps:{en:['Isolate the plant right away.','Rinse leaves in the shower, tops and undersides.','Wipe with soapy water or neem oil.','Repeat every 5 to 7 days for three weeks.'],ar:['اعزل النبات فورًا.','اغسل الأوراق تحت الدش من الأعلى والأسفل.','امسحها بماء وصابون أو زيت النيم.','كرّر كل 5 إلى 7 أيام لمدة ثلاثة أسابيع.']},
  prev:{en:'Check new plants for a week before placing them with others.',ar:'افحص النباتات الجديدة أسبوعًا قبل وضعها مع غيرها.'}},
 leggy:{sev:0,en:'Leggy, pale growth',ar:'نمو طويل باهت',
  cause:{en:['Not enough light: the plant stretches toward the window.','Pale new leaves also point to low light.'],ar:['ضوء غير كافٍ: يمتدّ النبات نحو النافذة.','الأوراق الجديدة الباهتة تدل أيضًا على قلة الضوء.']},
  steps:{en:['Move closer to a bright window with indirect light.','Rotate the pot a quarter turn every week.','Prune stretched stems to encourage bushy growth.'],ar:['انقله قرب نافذة مشرقة بضوء غير مباشر.','أدر الأصيص ربع دورة كل أسبوع.','قصّ السيقان الممتدة لتشجيع نمو كثيف.']},
  prev:{en:'Wipe dust off leaves so they catch more light.',ar:'امسح الغبار عن الأوراق لتلتقط ضوءًا أكثر.'}},
 mushy:{sev:2,en:'Mushy base or bad smell',ar:'قاعدة طرية أو رائحة',
  cause:{en:['Root rot: roots sit in water and begin to decay.','A pot without drainage, or soil that stays soggy.'],ar:['تعفّن الجذور: تبقى الجذور في الماء وتتحلل.','أصيص بلا تصريف أو تربة تبقى مشبعة.']},
  steps:{en:['Slide the plant out and rinse the roots.','Cut away everything black, brown or mushy with clean scissors.','Repot in fresh, airy mix in a pot with drainage holes.','Water lightly and wait a week before watering fully.'],ar:['أخرج النبات واشطف الجذور.','اقطع كل جزء أسود أو بني أو طري بمقص نظيف.','أعد زراعته في تربة جديدة مهوّاة في أصيص بثقوب تصريف.','اسقِ قليلًا وانتظر أسبوعًا قبل الري الكامل.']},
  prev:{en:'Never leave water standing in the saucer.',ar:'لا تترك الماء راكدًا في الصحن أبدًا.'}}

  if(r.steps.length)o.append(h('div',{class:'blk'},h('h4',null,t('rSteps')),list('ol',r.steps)));
  if(r.prevention)o.append(h('div',{class:'blk'},h('h4',null,t('rPrev')),h('p',null,String(r.prevention))));
  if(note)o.append(h('p',{class:'note',style:'font-weight:600'},note));
  o.append(h('p',{class:'foot'},r.src==='ai'?t('srcAI'):t('srcLocal')));
  o.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:450,easing:'cubic-bezier(.2,.8,.2,1)'});
}
const strArr=(a,n)=>Array.isArray(a)?a.filter(x=>typeof x==='string'&&x.trim()).slice(0,n).map(x=>x.slice(0,260)):[];
function normAI(d){
  if(!d||typeof d!=='object')return null;
  let sev=String(d.severity||'').toLowerCase();if(!SEV.includes(sev))sev='medium';
  const c=Number(d.confidence);
  return{notPlant:!!d.not_a_plant,title:String(d.diagnosis||'').slice(0,200),plant:d.plant?String(d.plant).slice(0,60):'',severity:sev,confidence:isFinite(c)?Math.max(0,Math.min(100,Math.round(c))):undefined,causes:strArr(d.causes,4),steps:strArr(d.steps,6),prevention:d.prevention?String(d.prevention).slice(0,260):'',src:'ai'};
}
async function runDx(){
  const syms=[...selSyms];
  if(!photo&&!syms.length){toast(t('dNeed'));return}
  if(photo&&!aiReady&&!syms.length){showMsg(t('dNoAI'));return}
  if(!photo||!aiReady){renderResult(localResult());return}
  const btn=$('#dxGo');btn.disabled=true;showBusy();
  ctl=new AbortController();
  const pl=S.plants.find(p=>p.id===$('#dxPlant').value),c=climate();
  const plantDesc=pl?`${SPM[pl.sp].en}, grown ${pl.where==='out'?'outdoors':'indoors'}`:'unknown';
  const prompt=`You are an experienced plant pathologist helping a home gardener. Look at the attached photo of a plant leaf.
Plant (as told by the user): ${plantDesc}.
Climate: ${CITIES[S.city].en}, about ${c.temp}°C and ${c.hum}% humidity this month.
Symptoms the user reports: ${syms.map(k=>SYM[k].en).join(', ')||'none given'}.
Write every text value in ${S.lang==='ar'?'Arabic':'English'}.
Reply with only one JSON object: {"not_a_plant":boolean,"plant":string,"diagnosis":string,"confidence":number from 0 to 100,"severity":"low" or "medium" or "high","causes":[string,string],"steps":[string,string,string,string],"prevention":string}
Keep each string under 170 characters. Be practical and specific. If the photo is unclear, say so in the diagnosis and lower the confidence.`;
  try{
    const raw=await sampleFn.json(prompt,{images:photo,modelTier:'default',cache:false,signal:ctl.signal});
    const r=normAI(raw);
    if(!r||(!r.title&&!r.notPlant))throw{code:'invalid_json'};
    if(r.notPlant)showMsg(t('dNotPlant'));else renderResult(r);
  }catch(e){
    const code=e&&e.code;
    if(code==='cancelled')placeholder();
    else if(syms.length)renderResult(localResult(),t('dAIFail')+(code?' ('+code+')':''));
    else if(code==='rate_limited')showMsg(t('dRate'));
    else if(code==='not_granted'||code==='images_unavailable'||code==='sampling_disabled'||code==='capability_disabled')showMsg(t('dNoAI'));
    else showMsg(t('dErr')+(code?' ('+code+')':''));
  }finally{btn.disabled=false;dz.querySelectorAll('.scan').forEach(n=>n.remove());ctl=null}
}
$('#dxGo').addEventListener('click',runDx);

(async()=>{

/* ---------- live weather (Open-Meteo) ---------- */
var CC={amman:[31.95,35.93],riyadh:[24.71,46.68],dubai:[25.2,55.27],doha:[25.29,51.53],cairo:[30.04,31.24],beirut:[33.89,35.5],baghdad:[33.31,44.37],casablanca:[33.57,-7.59],istanbul:[41.01,28.98],london:[51.51,-0.13],newyork:[40.71,-74.01]};
var W=null,wxSel=0,wxBusy=false;const WX_KEY='pp-wx-v1';
const RAINY=c=>(c>=51&&c<=67)||(c>=80&&c<=82)||c>=95;
const wxIcon=c=>c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌧️':c<=86?'🌨️':'⛈️';
const wxText=c=>t('wx_'+(c===0?'clear':c<=2?'part':c===3?'cloud':c<=48?'fog':c<=57?'driz':c<=67?'rain':c<=77?'snow':c<=82?'shower':c<=86?'snow':'storm'));
const wxCoords=()=>S.loc?[S.loc.lat,S.loc.lon]:CC[S.city];
const wxPlace=()=>S.loc?(S.loc.name||t('wxHere')):cityName();
const renderWxAll=()=>{renderClimate();renderToday();renderGarden()};
function effCond(){
  if(S.cond!=='auto')return S.cond;
  if(!W||W.day!==TODAY)return'auto';
  const d=W.days[0];
  if(RAINY(d.code)||d.rain>=1)return'rain';
  if(d.hi>=38)return'hot';if(d.hi<=4)return'cold';
  if(W.hum<20&&W.wind>=25)return'dry';
  return'auto';
}
function loadWeather(force){
  const [lat,lon]=wxCoords(),key=lat.toFixed(2)+','+lon.toFixed(2);
  try{const c=JSON.parse(localStorage.getItem(WX_KEY)||'null');
    if(!force&&c&&c.key===key&&c.day===TODAY&&Date.now()-c.ts<45*60000){W=c;renderWxAll();return}}catch(e){}
  if(wxBusy)return;wxBusy=true;renderWx();
  const u='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&forecast_days=5';
  fetch(u).then(r=>r.json()).then(d=>{
    const c=d.current,q=d.daily;
    W={key,day:TODAY,ts:Date.now(),temp:Math.round(c.temperature_2m),hum:Math.round(c.relative_humidity_2m),code:c.weather_code,wind:Math.round(c.wind_speed_10m),
      days:q.time.map((x,i)=>({date:x,code:q.weather_code[i],hi:Math.round(q.temperature_2m_max[i]),lo:Math.round(q.temperature_2m_min[i]),rain:+(q.precipitation_sum[i]||0)}))};
    W.mean=(W.days[0].hi+W.days[0].lo)/2;
    try{localStorage.setItem(WX_KEY,JSON.stringify(W))}catch(e){}
  }).catch(()=>{}).finally(()=>{wxBusy=false;renderWxAll()});
}
function useMyLocation(auto){
  if(!navigator.geolocation){if(auto!==true)toast(t('wxNoGeo'));return}
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=+pos.coords.latitude.toFixed(3),lon=+pos.coords.longitude.toFixed(3);
    S.loc={lat,lon,name:''};saveLocal();W=null;loadWeather(true);
    fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage='+S.lang).then(r=>r.json()).then(g=>{
      if(!S.loc)return;S.loc.name=[g.city||g.locality,g.countryName].filter(Boolean).join(S.lang==='ar'?'، ':', ');saveLocal();renderClimate()}).catch(()=>{});
  },()=>{if(auto!==true)toast(t('wxDenied'))},{timeout:10000,maximumAge:600000});
}
function wxTip(i){
  const d=W.days[i],out=[];
  out.push(RAINY(d.code)||d.rain>=1?t('tipRain'):d.hi>=36?t('tipHot'):d.lo<=3?t('tipCold'):t('tipMild'));
  const nm=[];S.plants.forEach(p=>{const x=info(p);if(i===0?(x.wDue<=0&&!x.rainSkip):x.wDue===i)nm.push(p.name||sname(p.sp))});
  if(nm.length)out.push(t('tipDue')+' '+nm.slice(0,5).join(S.lang==='ar'?'، ':', ')+(nm.length>5?' +'+(nm.length-5):''));
  return out.join(' ');
}
function renderWx(){
  const card=$('#weatherCard');if(!card)return;
  let box=$('#wxLive');if(!box){box=h('div',{id:'wxLive',class:'wxlive'});card.insertBefore(box,$('#pace'))}
  box.textContent='';
  box.append(h('div',{class:'wx-head'},h('span',{class:'wx-place'},'📍 '+wxPlace()),
    h('button',{class:'btn btn-ghost btn-sm',type:'button',onclick:()=>useMyLocation()},t('wxUseLoc')),
    h('button',{class:'icon-btn',type:'button','aria-label':t('wxRefresh'),title:t('wxRefresh'),onclick:()=>{loadWeather(true);toast(t('wxRefreshed'))},html:svg('<path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6"/>')})));
  if(!(W&&W.day===TODAY)){box.append(h('p',{class:'note'},wxBusy?t('wxLoading'):t('wxOffline')));return}
  const d0=W.days[0],loc=S.lang==='ar'?'ar-u-nu-latn':'en';
  box.append(h('div',{class:'wx-now'},h('span',{class:'wx-ico'},wxIcon(W.code)),
    h('div',null,h('b',null,wxText(W.code)),h('span',null,fmt(t('wxLine'),{hi:d0.hi,lo:d0.lo,w:W.wind,r:d0.rain.toFixed(1)}))),
    h('span',{class:'wx-upd'},t('wxUpd')+' '+new Date(W.ts).toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'}))));
  const strip=h('div',{class:'wx-days'});
  W.days.forEach((d,i)=>strip.append(h('button',{type:'button',class:'wx-day','aria-pressed':String(wxSel===i),onclick:()=>{wxSel=i;renderWx()}},
    h('small',null,i===0?t('today'):new Date(d.date+'T12:00:00').toLocaleDateString(S.lang==='ar'?'ar':'en',{weekday:'short'})),
    h('i',null,wxIcon(d.code)),h('b',null,d.hi+'°'),h('span',null,d.lo+'°'))));
  box.append(strip,h('p',{class:'wx-tip'},wxTip(Math.min(wxSel,W.days.length-1))));
}
function dayTick(){
  const n=Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);
  if(n!==TODAY){TODAY=n;S.cond='auto';S.condDay=TODAY;W=null;wxSel=0;saveLocal();loadWeather(true);renderAll()}
  else if(W&&Date.now()-W.ts>60*60000)loadWeather(true);
  remCheck();

/* ---------- care reminders ---------- */
var swReg=null,planT=null;const canNotify='Notification' in window;
const remOK=()=>S.rem.on&&canNotify&&Notification.permission==='granted';
function planOf(){
  return{on:remOK(),time:S.rem.time,lang:S.lang,url:location.href.split('#')[0],last:S.rem.last,
    items:S.plants.flatMap(p=>{const i=info(p),n=p.name||sname(p.sp);return[{n,k:'w',d:TODAY+i.wDue}].concat(i.resting?[]:[{n,k:'f',d:TODAY+i.fDue}])})};
}
function postPlan(){if(swReg&&swReg.active)swReg.active.postMessage({type:'plan',plan:planOf()})}
function syncSWsoon(){clearTimeout(planT);planT=setTimeout(postPlan,500)}
async function regSW(){
  if(swReg)return swReg;
  try{if(!('serviceWorker' in navigator)||!/^https?:/.test(location.protocol))return null;
    await navigator.serviceWorker.register('sw.js');swReg=await navigator.serviceWorker.ready;return swReg}catch(e){return null}
}
function remBody(w,f,ar){
  const j=a=>a.slice(0,6).join(ar?'، ':', ')+(a.length>6?' +'+(a.length-6):'');
  return[w.length?(ar?'💧 اسقِ: ':'💧 Water: ')+j(w):'',f.length?(ar?'🌱 سمّد: ':'🌱 Feed: ')+j(f):''].filter(Boolean).join('\n');
}
function dueNames(){const w=[],f=[];S.plants.forEach(p=>{const i=info(p),n=p.name||sname(p.sp);if(i.wDue<=0&&!i.rainSkip)w.push(n);if(i.fDue<=0&&!i.resting)f.push(n)});return{w,f}}
async function showNote(title,body,tag){
  try{const reg=swReg||(navigator.serviceWorker&&await navigator.serviceWorker.getRegistration());
    if(reg&&reg.showNotification){await reg.showNotification(title,{body,tag,icon:'icon.svg',badge:'icon.svg',lang:S.lang,dir:S.lang==='ar'?'rtl':'ltr',data:{url:location.href.split('#')[0]}});return true}}catch(e){}
  try{if(canNotify&&Notification.permission==='granted'){new Notification(title,{body,tag,icon:'icon.svg'});return true}}catch(e){}
  return false;
}
function remCheck(){
  if(!remOK()||S.rem.last===TODAY)return;
  const [hh,mm]=S.rem.time.split(':').map(Number),n=new Date();
  if(n.getHours()*60+n.getMinutes()<hh*60+mm)return;
  const d=dueNames();S.rem.last=TODAY;saveLocal();
  if(d.w.length||d.f.length)showNote(t('remTitle'),remBody(d.w,d.f,S.lang==='ar'),'care-'+TODAY);
}
function setRemMsg(m){const el=$('#remMsg');if(el)el.textContent=m}
async function toggleRem(){
  if(S.rem.on){S.rem.on=false;saveLocal();postPlan();renderRem();return}
  if(!canNotify){setRemMsg(t('remUnsupported'));return}
  let perm=Notification.permission;if(perm==='default')perm=await Notification.requestPermission();
  if(perm!=='granted'){renderRem();setRemMsg(t('remDenied'));return}
  S.rem.on=true;S.rem.last=-1;saveLocal();await regSW();
  showNote(t('remTitle'),t('remOnBody'),'care-test');
  try{if(swReg&&'periodicSync' in swReg){const st=await navigator.permissions.query({name:'periodic-background-sync'});if(st.state==='granted')await swReg.periodicSync.register('plant-care',{minInterval:6*3600*1000})}}catch(e){}
  postPlan();renderRem();remCheck();
}
function testNote(){
  if(!(canNotify&&Notification.permission==='granted')){setRemMsg(t('remEnableFirst'));return}
  const d=dueNames();showNote(t('remTitle'),(d.w.length||d.f.length)?remBody(d.w,d.f,S.lang==='ar'):t('remNothing'),'care-test');
}
function downloadICS(){
  const [hh,mm]=S.rem.time.split(':'),pad=n=>String(n).padStart(2,'0'),ar=S.lang==='ar';
  const ymd=day=>{const d=new Date(day*86400000);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())};
  const esc=x=>String(x).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Plant Parent//EN','CALSCALE:GREGORIAN'];
  S.plants.forEach(p=>{const i=info(p),n=p.name||sname(p.sp);
    [['w',i.wi,i.wDue,(ar?'💧 اسقِ ':'💧 Water ')+n],['f',i.fi,i.fDue,(ar?'🌱 سمّد ':'🌱 Feed ')+n]].forEach(([k,iv,due,sum])=>
      out.push('BEGIN:VEVENT','UID:'+p.id+'-'+k+'@plantparent','DTSTAMP:'+stamp,'DTSTART:'+ymd(TODAY+Math.max(0,due))+'T'+pad(hh)+pad(mm)+'00','DURATION:PT15M','RRULE:FREQ=DAILY;INTERVAL='+iv,'SUMMARY:'+esc(sum),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc(sum),'TRIGGER:PT0M','END:VALARM','END:VEVENT'))});
  out.push('END:VCALENDAR');
  const a=h('a',{href:URL.createObjectURL(new Blob([out.join('\r\n')],{type:'text/calendar'})),download:'plant-care.ics'});
  document.body.append(a);a.click();a.remove();toast(t('remIcsDone'));
}
function renderRem(){
  const card=$('#todayCard');if(!card)return;
  let box=$('#remBox');if(!box){box=h('div',{id:'remBox',class:'rem'});card.append(box)}
  box.textContent='';const on=remOK();
  box.append(
    h('div',{class:'rem-head'},h('b',null,'🔔 '+t('remTitle')),h('button',{type:'button',class:'switch',role:'switch','aria-checked':String(on),'aria-label':t('remTitle'),onclick:toggleRem},h('i'))),
    h('div',{class:'rem-row'},h('label',{for:'remTime'},t('remAt')),h('input',{type:'time',id:'remTime',value:S.rem.time,onchange:e=>{S.rem.time=e.target.value||'08:00';S.rem.last=-1;saveLocal();postPlan();remCheck()}})),
    h('div',{class:'rem-row'},h('button',{class:'btn btn-ghost btn-sm',type:'button',onclick:testNote},t('remTest')),h('button',{class:'btn btn-ghost btn-sm',type:'button',onclick:downloadICS},t('remIcs'))),
    h('p',{class:'note',id:'remMsg'},on?t('remOnNote'):t('remOffNote')));
}

/* ---------- snooze + plant details ---------- */
function snooze(id,k){const p=S.plants.find(x=>x.id===id);if(!p)return;p[k==='w'?'zw':'zf']=TODAY+1;save();renderToday();renderGarden();renderWx();toast(t('snoozed'))}

  const row=(lbl,arr)=>h('div',{class:'dt-row'},h('b',null,lbl),h('div',{class:'dt-chips'},arr.map(x=>h('span',{class:'tag'},x))));
  const m=h('div',{class:'modal card gloss',role:'dialog','aria-modal':'true'},
    h('div',{class:'dt-top'},h('div',{class:'p3d big',html:plant3d(s)}),
      h('div',null,h('h2',null,nm),h('p',{class:'note'},sname(p.sp)),alts(s).length?h('p',{class:'al2'},t('alsoCalled')+' '+alts(s).join(' · ')):null,
        h('div',{class:'tags'},h('span',{class:'tag'},p.where==='out'?t('outdoor'):t('indoor')),h('span',{class:'tag'},t('cat_'+s.type))))),
    row('💧 '+t('water'),nxt(i.wDue,i.wi,4)),
    i.resting?h('p',{class:'note'},t('resumes')):row('🌱 '+t('feed'),nxt(i.fDue,i.fi,3)),
    h('p',{class:'note'},fmt(t('dtNote'),{w:i.wi,f:i.fi})),
    h('div',{class:'modal-actions'},
      h('button',{class:'btn btn-ghost',type:'button',onclick:()=>close()},t('close')),
      h('button',{class:'btn btn-ghost',type:'button',onclick:()=>{doFeed(id);close()}},t('fed')),
      h('button',{class:'btn btn-leaf',type:'button',onclick:()=>{doWater(id);close()}},t('watered'))));
  veil.append(m);root.append(veil);
  const onKey=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',onKey);
  function close(){document.removeEventListener('keydown',onKey);veil.remove()}
}

function renderAll(){applyLang();setSync(syncState);renderClimate();renderRem();renderToday();renderGarden();renderDx();if(!$('#dxOut').firstChild)placeholder();drawDz()}
$('#langBtn').addEventListener('click',()=>{S.lang=S.lang==='ar'?'en':'ar';save();$('#dxOut').textContent='';renderAll()});
$('#citySel').addEventListener('change',e=>{if(e.target.value==='loc')return;S.city=e.target.value;S.loc=null;W=null;save();renderAll();loadWeather(true)});

$('#heroAdd').addEventListener('click',openModal);
renderAll();
loadWeather();
(async()=>{if(remOK()){await regSW();postPlan();remCheck()}else regSW()})();
setInterval(dayTick,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)dayTick()});
try{if(!S.loc){const first=!localStorage.getItem('pp-geo-asked'),go=()=>{try{localStorage.setItem('pp-geo-asked','1')}catch(e){}useMyLocation(true)};
  if(navigator.permissions&&navigator.permissions.query)navigator.permissions.query({name:'geolocation'}).then(r=>{if(r.state==='granted'||(r.state==='prompt'&&first))go()}).catch(()=>{if(first)go()});
  else if(first)go()}}catch(e){}
})();
